[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "consilience-judges"
version = "0.1.0"
description = "Receipts for guardrail judges: checks whether the evidence an LLM judge cites is really in what it was given. No model, no network."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anuja Khatri" }]
keywords = ["guardrails", "llm judge", "grounding", "receipts", "deterministic", "any-guardrail"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
# No runtime dependencies, on purpose: nothing here can call a model or a network service.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
consilience-judges = "consilience_judges.cli:main"

[tool.setuptools.packages.find]
include = ["consilience_judges*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"study/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
